name: Setup Sigilune
description: Install Sigilune on a Windows runner to Authenticode-sign files with a Certum SimplySign cloud certificate
author: Kagayoi
branding:
  icon: edit-3
  color: purple

# 使い方（ワークフロー側）:
#   - uses: 1llum1n4t1s/Sigilune@v1
#   - run: sigilune sign dist\MyApp.exe
#     env:
#       SIGILUNE_EMAIL: ${{ secrets.SIGILUNE_EMAIL }}
#       SIGILUNE_TOTP_URI: ${{ secrets.SIGILUNE_TOTP_URI }}
# Secrets は承認つき Environment に置き、署名するジョブで `environment:` を指定する。
#
# 入れる版の決め方（利用側の更新方法と対応させる）:
#   1. inputs.version を指定 → その版
#   2. アクションを完全な版タグ（@v1.2.3）で参照 → その版（再現性のため。Dependabot が参照を更新する）
#   3. それ以外（@v1 などの移動タグ・ブランチ・SHA）→ 最新リリース

inputs:
  version:
    description: Release to install (e.g. 1.0.0) or "latest". Default — the action's own version tag, else the latest release.
    required: false
    default: ''

outputs:
  path:
    description: Folder that contains sigilune.exe, sigilune_dlib.dll and sigilune-manifest.exe
    value: ${{ steps.install.outputs.path }}
  version:
    description: Installed Sigilune version
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install Sigilune
      id: install
      shell: pwsh
      env:
        SIGILUNE_INSTALL_VERSION: ${{ inputs.version }}
        SIGILUNE_ACTION_REF: ${{ github.action_ref }}
      run: |
        if ($env:RUNNER_OS -ne 'Windows') { throw 'Sigilune runs on Windows runners only.' }
        $version = $env:SIGILUNE_INSTALL_VERSION
        if (-not $version) {
          $version = if ($env:SIGILUNE_ACTION_REF -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { 'latest' }
        }
        $dir = Join-Path $env:RUNNER_TEMP 'sigilune'
        & (Join-Path $env:GITHUB_ACTION_PATH 'install.ps1') -Version $version -InstallDir $dir -NoPath
        $installed = ((& (Join-Path $dir 'sigilune.exe') --version) -split ' ')[-1]
        $dir >> $env:GITHUB_PATH
        "path=$dir" >> $env:GITHUB_OUTPUT
        "version=$installed" >> $env:GITHUB_OUTPUT
        # ランナーごとに独立したセッションキャッシュを使う。
        "SIGILUNE_HOME=$(Join-Path $env:RUNNER_TEMP 'sigilune-home')" >> $env:GITHUB_ENV
