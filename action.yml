name: Setup Sigilune
description: Install Sigilune on a Windows runner to Authenticode-sign files with a Certum SimplySign cloud certificate
author: Kagayoi
branding:
  icon: edit-3
  color: purple

# 使い方（ワークフロー側）:
#   - uses: 1llum1n4t1s/Sigilune@v1
#   - run: sigilune sign dist\MyApp.exe
#     env:
#       SIGILUNE_EMAIL: ${{ secrets.SIGILUNE_EMAIL }}
#       SIGILUNE_TOTP_URI: ${{ secrets.SIGILUNE_TOTP_URI }}
# Secrets は配信タグ（または配信ブランチ）を制限した Environment に置き、署名するジョブで `environment:` を指定する。
#
# 入れる版の決め方（GitHub Release は使わない。配布物は R2 の https://sigilune.kagayoi.com にある）:
#   1. inputs.version を指定 → その版（"latest" なら R2 の latest.json の版）
#   2. 指定なし → このアクション自身のチェックアウト（$GITHUB_ACTION_PATH）の Cargo.toml の版
#      uses: …@v1 で参照したコミット（移動タグ v1 は、R2 配信が成功した最新版の commit）が入れる版を決める
#      （github.action_ref には依存しない）。完全に固定したい利用者は @<完全なコミット SHA> も使える。

inputs:
  version:
    description: Version to install (e.g. 1.0.0) or "latest". Default - the version in the checked-out action (Cargo.toml), so the commit behind the @v1 tag (or a pinned SHA) decides the version.
    required: false
    default: ''

outputs:
  path:
    description: Folder that contains sigilune.exe, sigilune_dlib.dll and sigilune-manifest.exe
    value: ${{ steps.install.outputs.path }}
  version:
    description: Installed Sigilune version
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install Sigilune
      id: install
      shell: pwsh
      env:
        SIGILUNE_INSTALL_VERSION: ${{ inputs.version }}
      run: |
        if ($env:RUNNER_OS -ne 'Windows') { throw 'Sigilune runs on Windows runners only.' }
        $version = $env:SIGILUNE_INSTALL_VERSION
        if (-not $version) {
          # 参照したコミットの Cargo.toml（[workspace.package] の version）から決める。
          # 行頭の `version = "x.y.z"` の最初の一致が [workspace.package] のもの（他の表より前にある）。
          $cargo = Get-Content -LiteralPath (Join-Path $env:GITHUB_ACTION_PATH 'Cargo.toml') -Raw
          if ($cargo -notmatch '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"') { throw 'could not read the Sigilune version from the action checkout (Cargo.toml).' }
          $version = $Matches[1]
        }
        $dir = Join-Path $env:RUNNER_TEMP 'sigilune'
        & (Join-Path $env:GITHUB_ACTION_PATH 'install.ps1') -Version $version -InstallDir $dir -NoPath
        $installed = ((& (Join-Path $dir 'sigilune.exe') --version) -split ' ')[-1]
        $dir >> $env:GITHUB_PATH
        "path=$dir" >> $env:GITHUB_OUTPUT
        "version=$installed" >> $env:GITHUB_OUTPUT
        # ランナーごとに独立したセッションキャッシュを使う。
        "SIGILUNE_HOME=$(Join-Path $env:RUNNER_TEMP 'sigilune-home')" >> $env:GITHUB_ENV
