name: Release

# 配布用 zip（sigilune.exe / sigilune_dlib.dll / sigilune-manifest.exe）を作り、Sigilune 自身で Certum のクラウド鍵により署名する。
# タグも GitHub Release も使わない。配布は Cloudflare R2（https://sigilune.kagayoi.com）が唯一の入口。
# - release/<version> ブランチの push: 署名済み zip と SHA256 を R2 へ配信し、latest.json を更新する。
# - 手動実行（workflow_dispatch）: 同じ release/<version> ブランチを指定して配信をやり直す（R2 に同じ版が
#   あれば内容が同一のときだけ成功。内容が違えば上書きせず失敗する）。
# 署名・配信用の Secrets（SIGILUNE_EMAIL / SIGILUNE_TOTP_URI / CLOUDFLARE_API_TOKEN）は
# Environment "release"（release/* ブランチだけ許可、承認者なし）にだけ置く。
on:
  push:
    # GitHub のブランチフィルタは glob（正規表現ではない）。release/1.1.3 のような名前に一致する。
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    environment: release
    # R2 へは Cloudflare のトークンで書くため、GitHub の書込み権限は要らない。
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'sigilune' | Select-Object -ExpandProperty version
          if (-not $version) { throw 'could not read the sigilune version' }
          # ブランチ名 release/<版> とクレートの版が一致しなければ止める（別の版を誤って配信しない）。
          if ($env:GITHUB_REF_TYPE -ne 'branch' -or $env:GITHUB_REF_NAME -cne "release/$version") {
            throw "ref $env:GITHUB_REF_NAME does not match release/$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        # sigilune-manifest.exe（.NET Framework 4.8 向け）のビルドに使う。参照アセンブリは NuGet から取る。
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'

      - name: Test
        run: cargo test --locked

      - name: Build
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
          dotnet build dotnet/Sigilune.Manifest/Sigilune.Manifest.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o "$env:RUNNER_TEMP/manifest-tool"
          if ($LASTEXITCODE -ne 0) { throw 'building sigilune-manifest failed' }

      - name: Test manifest signing
        # 移植した ClickOnce 署名が mage.exe とバイト単位で一致し、検証・改ざん検出が働くことを確かめる。
        run: ./tests/Test-ManifestSigning.ps1 -Tool "$env:RUNNER_TEMP/manifest-tool/sigilune-manifest.exe" -WorkDirectory "$env:RUNNER_TEMP/manifest-test"

      - name: Stage files
        id: stage
        run: |
          # 実行中の exe は署名で書き換えられないため、署名に使う道具と配布物を別フォルダーへ分ける。
          $tool = Join-Path $env:RUNNER_TEMP 'sigilune-tool'
          $dist = Join-Path $env:RUNNER_TEMP 'sigilune'
          New-Item -ItemType Directory -Path $tool, $dist -Force | Out-Null
          foreach ($f in 'sigilune.exe', 'sigilune_dlib.dll') {
            Copy-Item "target/release/$f" $tool
            Copy-Item "target/release/$f" $dist
          }
          foreach ($f in 'sigilune-manifest.exe', 'sigilune-manifest.exe.config') {
            Copy-Item (Join-Path $env:RUNNER_TEMP "manifest-tool/$f") $dist
          }
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md $dist
          "tool=$tool" >> $env:GITHUB_OUTPUT
          "dist=$dist" >> $env:GITHUB_OUTPUT

      - name: Sign with Sigilune
        env:
          SIGILUNE_EMAIL: ${{ secrets.SIGILUNE_EMAIL }}
          SIGILUNE_TOTP_URI: ${{ secrets.SIGILUNE_TOTP_URI }}
          SIGILUNE_HOME: ${{ runner.temp }}\sigilune-home
        run: |
          $sigilune = Join-Path '${{ steps.stage.outputs.tool }}' 'sigilune.exe'
          $dist = '${{ steps.stage.outputs.dist }}'
          try {
            # 署名後に有効性・署名者・タイムスタンプを検証し、失敗なら非0で止まる。
            & $sigilune sign (Join-Path $dist 'sigilune.exe') (Join-Path $dist 'sigilune_dlib.dll') (Join-Path $dist 'sigilune-manifest.exe')
            if ($LASTEXITCODE -ne 0) { throw "sigilune sign failed ($LASTEXITCODE)" }
          } finally {
            & $sigilune logout | Out-Null
          }

      - name: Package
        id: package
        run: |
          $name = "sigilune-${{ steps.version.outputs.version }}-win-x64.zip"
          $zip = Join-Path $env:RUNNER_TEMP $name
          Compress-Archive -Path (Join-Path '${{ steps.stage.outputs.dist }}' '*') -DestinationPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii -NoNewline
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Verify package
        # 配信する zip そのものを展開し、版・同梱ファイル・署名（有効・署名者・タイムスタンプ）を照合する。
        # ここで失敗すれば成果物の保存も R2 への配信も行わない。
        run: |
          $zip = '${{ steps.package.outputs.zip }}'
          $check = Join-Path $env:RUNNER_TEMP 'verify'
          Expand-Archive -LiteralPath $zip -DestinationPath $check
          $expected = @('LICENSE', 'README.md', 'THIRD_PARTY_NOTICES.md', 'sigilune-manifest.exe', 'sigilune-manifest.exe.config', 'sigilune.exe', 'sigilune_dlib.dll')
          $actual = @(Get-ChildItem -LiteralPath $check -File | ForEach-Object Name | Sort-Object)
          if (Compare-Object $expected $actual) { throw "unexpected package contents: $($actual -join ', ')" }
          $reported = (& (Join-Path $check 'sigilune.exe') --version)
          if ($reported -ne 'sigilune ${{ steps.version.outputs.version }}') { throw "version mismatch: $reported" }
          & (Join-Path $check 'sigilune.exe') verify (Join-Path $check 'sigilune.exe') (Join-Path $check 'sigilune_dlib.dll') (Join-Path $check 'sigilune-manifest.exe') --signer 'Open Source Developer Yuichiro Shinozaki'
          if ($LASTEXITCODE -ne 0) { throw 'signature verification failed' }
          Write-Host "verified $zip  sha256=$((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash)"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sigilune-${{ steps.version.outputs.version }}-win-x64
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error

      - name: Publish to R2
        # 版付きの不変ファイルを先に置き、公開 URL で照合してから latest.json を更新する（詳細は scripts/Publish-R2.ps1）。
        # 同じ版が R2 にあれば、内容が同一のときだけ成功する（別内容は上書きせず失敗）。
        # R2 の latest.json がより新しい版なら latest.json は更新しない。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # 失敗は Publish-R2.ps1 が例外(throw)で知らせる。ここで $LASTEXITCODE を見ると、配信が全部成功した後でも
          # スクリプト内部のネイティブ呼び出しの終了コードが残っていて誤って失敗扱いになるため、確認しない(1.1.3 で発生)。
          ./scripts/Publish-R2.ps1 -Version '${{ steps.version.outputs.version }}' -ZipPath '${{ steps.package.outputs.zip }}'
