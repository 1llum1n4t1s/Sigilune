name: CI

# クラウド署名は本人の TOTP と端末が必要なため CI では行わない。
# CI ではテスト用ローカル鍵で signtool /dlib の結合テスト（exe / msi / ps1 / msix）と、
# ClickOnce / VSTO マニフェスト署名の mage.exe との比較テストまで確認する。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Rust 検証（fmt / clippy / test）。manifest ジョブと並列に走らせて待ち時間を縮める。
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Rust build
        # 保存は main だけ（PR は復元のみ）。キャッシュ容量と汚染を抑える。
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  # ClickOnce / VSTO マニフェスト署名の補助ツール（dotnet）と install.ps1 / R2 検査。Rust には依存しない。
  manifest:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'
      - name: Build sigilune-manifest
        run: dotnet build dotnet/Sigilune.Manifest/Sigilune.Manifest.csproj -c Release -o "$env:RUNNER_TEMP/manifest-tool"
      - name: Test manifest signing
        # 使い捨ての自己署名鍵で mage.exe と出力を突き合わせる（Certum には接続しない）。
        run: ./tests/Test-ManifestSigning.ps1 -Tool "$env:RUNNER_TEMP/manifest-tool/sigilune-manifest.exe" -WorkDirectory "$env:RUNNER_TEMP/manifest-test"
      - name: Test installer and R2 publish checks
        # install.ps1（R2 からの取得・SHA-256 照合）と Publish-R2.ps1 の入力検査を、ローカルのモック HTTP で確かめる（R2 には接続しない）。
        run: ./tests/Test-Install.ps1 -WorkDirectory "$env:RUNNER_TEMP/install-test"
